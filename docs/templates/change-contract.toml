schema_version = "1"
change_id = "GH-NNN"
issue = 1
title = "Resultado curto da mudança"
classification = "feature" # refactor|behavior-compatible|feature|breaking|docs-only|generated
base_ref = "origin/main"
branch_pattern = "feat/issue-*"
expected_outcome = "O resultado observável que encerra a entrega."
confirmed_facts = ["Fato confirmado no checkout atual."]
stop_conditions = ["Pergunta ou risco que exige parar e escalar."]

[impact]
capability = "none"          # none|additive|changed|removed|breaking
persisted_contract = "none" # none|additive|changed|removed|breaking
normative = "none"          # none|additive|changed|removed|breaking
notes = []

[scope]
expected = ["src/owned/**", "tests/owned/**"]
forbidden = ["docs/adr/**"]
preexisting = [] # mudanças do usuário observadas antes da task; são preservadas e excluídas

# Expansão descoberta depois do plano: orienta revisão sem limitar a exploração do agente.
[[scope.expansions]]
patterns = ["docs/operation-affected.md"]
rationale = "O comportamento implementado exige atualizar a instrução operacional existente."

[[scope.generated]]
patterns = ["schemas/generated/**"]
source_patterns = ["src/evidrun/contracts/**", "scripts/generate_schemas.py"]

[preserve]
interfaces = ["Interface pública que deve permanecer compatível."]
errors = ["Código/status/exit code que não pode mudar."]
invariants = ["Invariante normativa aplicável a esta mudança."]

[verification]
focused = ["uv run pytest tests/unit/test_affected.py"]
full_gates = ["uv run pytest", "uv run ruff check ."]

# As quatro camadas do merge gate. CI verde prova que os checks rodaram; ela não prova
# resultado, padrões nem suficiência da verificação. Cada camada conclui separadamente e
# aponta a própria evidência na forma `<kind>:<referência>`, com kind em
# diff|test|log|review|run. Entrada `run:` é reservada à camada ci: citá-la em spec,
# standards ou verification é exatamente a substituição que o gate recusa.
#
# `review` é a profundidade da revisão. `orthogonal` (revisão independente) é obrigatória
# quando a mudança é breaking, remove/quebra capability ou documentação normativa, ou toca
# contrato persistido. Caso contrário `proportional` é suficiente.
#
# `ci_commit` é o SHA em que a suíte completa rodou. Nenhum arquivo entregue pode mudar
# depois dele; o próprio contrato pode, porque registrar a evidência não a invalida.
[merge_gate]
review = "proportional" # orthogonal|proportional
ci_commit = "0000000"

[merge_gate.spec]
conclusion = "passed" # passed|not-applicable
evidence = ["diff:src/owned/module.py"]

[merge_gate.standards]
conclusion = "passed"
evidence = ["review:PR#0"]

[merge_gate.verification]
conclusion = "passed"
evidence = ["test:tests/unit/test_affected.py"]

# `not-applicable` exige justification; a camada ci nunca pode ser not-applicable.
[merge_gate.ci]
conclusion = "passed"
evidence = ["run:actions/0"]

[[questions]]
text = "Pergunta encontrada durante discovery."
affects_semantics = false
status = "open"

# Obrigatório apenas quando classification="refactor". Nesse caso, inclua também o command abaixo
# em verification.focused.
# [oracle]
# kind = "equivalence" # characterization|equivalence
# command = "uv run pytest tests/characterization/test_before_after.py"
# evidence = ["tests/characterization/test_before_after.py"]
# preserves = ["capability", "persisted-contract", "fail-closed"]
