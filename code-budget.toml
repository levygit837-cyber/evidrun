# Orçamento estrutural verificado por `scripts/check_code_budget.py`.
#
# Grupos são avaliados na ordem de declaração: o primeiro glob que casa define o
# orçamento do arquivo. Métrica ausente em um grupo significa "sem limite".
#
# A tabela [baseline] é um ratchet dos arquivos que já violavam a política quando
# o gate foi ligado. Uma métrica listada pode encolher, nunca crescer; quando ela
# volta para dentro do orçamento do grupo, o gate exige a remoção da entrada.
# Regrave o baseline apenas de forma deliberada e manual:
#
#     uv run python scripts/check_code_budget.py --update-baseline

[[groups]]
name = "exempt"
exempt = true
patterns = [
  "apps/web/src/generated/**",
  "schemas/generated/**",
  "docs/_generated/**",
  "**/*.lock",
  "pnpm-lock.yaml",
  "uv.lock",
]

[[groups]]
name = "tests"
patterns = [
  "tests/**/*.py",
  "apps/**/*.test.ts",
  "apps/**/*.test.tsx",
]
max_file_lines = 800

[[groups]]
name = "source"
patterns = [
  "src/**/*.py",
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "scripts/*.py",
  "scripts/*.mjs",
]
max_file_lines = 500
max_function_lines = 120
max_public_methods = 25

