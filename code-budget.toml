# Orçamento estrutural verificado por `scripts/check_code_budget.py`.
#
# Grupos são avaliados na ordem de declaração: o primeiro glob que casa define o
# orçamento do arquivo. Métrica ausente em um grupo significa "sem limite".
#
# A tabela [baseline] é um ratchet dos arquivos que já violavam a política quando
# o gate foi ligado. Uma métrica listada pode encolher, nunca crescer; quando ela
# volta para dentro do orçamento do grupo, o gate exige a remoção da entrada.
# Regrave o baseline apenas de forma deliberada e manual:
#
#     uv run python scripts/check_code_budget.py --update-baseline
#
# `warn_at_ratio` é a fração do orçamento a partir da qual o gate AVISA sem falhar.
# Default 0.8, aplicado a todo grupo que não declara o seu. O aviso existe para que
# um arquivo perto do teto seja visto antes de virar violação; ele nunca muda o exit
# code. Só arquivos rastreados pelo git são medidos: nada ainda fora do índice aparece
# como aviso ou violação.

[[groups]]
name = "exempt"
exempt = true
patterns = [
  "apps/web/src/generated/**",
  "schemas/generated/**",
  "docs/_generated/**",
  "**/*.lock",
  "pnpm-lock.yaml",
  "uv.lock",
]

[[groups]]
name = "tests"
patterns = [
  "tests/**/*.py",
  "apps/**/*.test.ts",
  "apps/**/*.test.tsx",
]
max_file_lines = 800
warn_at_ratio = 0.8

[[groups]]
name = "source"
patterns = [
  "src/**/*.py",
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "scripts/**/*.py",
  "scripts/**/*.mjs",
]
max_file_lines = 500
max_function_lines = 120
max_public_methods = 25
warn_at_ratio = 0.8

