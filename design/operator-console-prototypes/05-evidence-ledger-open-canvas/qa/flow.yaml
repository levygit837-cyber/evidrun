version: 1
name: evidence-ledger-open-canvas
base_url: http://127.0.0.1:4305
capture_tool: chrome-extension
browser_session: "EvidRun prototype QA"

viewports:
  desktop:
    width: 1440
    height: 940
  tablet:
    width: 834
    height: 1112
  mobile:
    width: 390
    height: 844

flows:
  - id: lab-first-use-and-agent
    viewport: desktop
    start: /
    steps:
      - observe: heading
        name: "O que você quer investigar?"
      - expect:
          disabled_button: "Enviar"
          text:
            - "Demonstração local"
            - "Chat excluído"
      - fill:
          role: textbox
          name: "Conversa e intenção"
          value: "Mostre a proveniência da comparação CRL-CTX-002 e prepare um draft de Study."
      - press:
          role: textbox
          name: "Conversa e intenção"
          key: Enter
      - wait_ms: 2200
      - expect:
          text:
            - "Atividade observável"
            - "Tool Call"
            - "Tool Result"
            - "contexto ilustrativo autorizado"

  - id: project-workflow-and-dialog
    viewport: desktop
    start: /projects
    steps:
      - expect:
          heading: "Escopos e proveniência"
          text:
            - "StudyRevision"
            - "AdmissionRecord"
            - "Comparison"
            - "Workspace local separado"
      - click:
          role: button
          name_pattern: "RunSpec tail-preservation"
      - expect:
          heading: "tail-preservation"
      - click:
          role: button
          name: "Criar Project"
      - click:
          within_dialog: "Criar Project local"
          role: button
          name: "Criar Project"
      - expect:
          alerts:
            - "Use pelo menos 3 caracteres."
            - "Descreva o escopo em pelo menos 12 caracteres."
      - fill:
          within_dialog: "Criar Project local"
          role: textbox
          name: "Nome do Project"
          value: "Trace Audit Lab"
      - fill:
          within_dialog: "Criar Project local"
          role: textbox
          name: "Descrição"
          value: "Escopo local para validar a criação e o filtro."
      - click:
          within_dialog: "Criar Project local"
          role: button
          name: "Criar Project"
      - expect:
          text: "Trace Audit Lab"
          dialog_absent: "Criar Project local"

  - id: study-admission-gate
    viewport: desktop
    start: /study
    steps:
      - expect:
          heading: "Preservação da causa-raiz em logs longos"
          text:
            - "unsupported_execution_contract"
            - "max_turns=3"
            - "max_turns=1"
          disabled_button: "Enfileirar RunSpec"
      - click:
          role: button
          name: "tail-preservation"
          exact: true
      - expect:
          text:
            - "admitted"
            - "decision=admitted"
          enabled_button: "Enfileirar RunSpec"

  - id: completed-and-live-runs
    viewport: desktop
    start: /runs
    steps:
      - expect:
          heading: "Run completed"
          text:
            - "9 eventos"
            - "references_only"
            - "portable"
            - "replayable"
          absent_text: "tool.called · read_text"
      - click:
          role: button
          name: "Live ilustrativa"
      - expect:
          heading: "Run Observatory"
          text:
            - "tool.called · read_text"
            - "Sequência ilustrativa separada"
      - click:
          role: button
          name: "Abrir Chat"
      - expect:
          complementary: "Chat contextual"
          text: "Run / evidência selecionada"
      - click:
          role: button
          name: "Usar thread amplo"
      - navigate_via_button: "Lab"
      - expect:
          path: /
          complementary: "Chat contextual"
          text: "Lab / intenção atual"
      - click:
          role: button
          name: "Colapsar thread"
      - expect:
          button: "Expandir thread"
      - click:
          role: button
          name: "Fechar Chat"
      - expect:
          button: "Chat"
          complementary_absent: "Chat contextual"

  - id: responsive-reflow
    start: /
    steps:
      - set_viewport: tablet
      - expect:
          visible_navigation: "Navegação principal"
          horizontal_document_overflow: false
      - navigate_via_button: "Study & Admission"
      - expect:
          topbar_overlap: false
          horizontal_document_overflow: false
      - set_viewport: mobile
      - navigate_via_button: "Lab"
      - expect:
          mobile_navigation: true
          sidebar_hidden: true
          scroll_position: 0
          horizontal_document_overflow: false
      - click:
          role: button
          name: "Chat"
      - expect:
          bottom_sheet_within_viewport: true
      - press:
          role: slider
          name: "Ajustar encaixe do Chat"
          key: End
      - expect:
          chat_snap: full

