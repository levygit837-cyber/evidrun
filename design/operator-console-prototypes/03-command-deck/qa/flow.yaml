version: 1
prototype:
  name: Command Deck
  base_url: http://localhost:4303
  implementation: deterministic React UI stub
  provider_calls: none
  routes:
    lab: "#/lab"
    projects: "#/projects"
    study: "#/study"
    runs: "#/runs"

preconditions:
  - Start the Vite server on port 4303.
  - Use a clean browser tab at http://localhost:4303/#/lab.
  - Treat every record marked Demonstração local or Stub local as illustrative data.

flows:
  - id: navigation-and-history
    title: Navigate every stable route and use browser history
    verification: chrome-browser
    steps:
      - action: Open the Lab route.
        expect: The level-one heading is "Investigue um input autorizado" and Lab is the selected destination.
      - action: Activate Projects from the command rail.
        expect: The URL is #/projects and the level-one heading is "Projects".
      - action: Activate Study, then Runs.
        expect: Each route has a stable hash and exactly one main landmark remains in the DOM.
      - action: Use the browser Back command once.
        expect: The browser returns to the previous route without a blank or mixed route state.

  - id: lab-success
    title: Run the authorized Lab stub from an empty composer
    verification: chrome-browser-and-vitest
    steps:
      - action: Open Lab and activate "Abrir composer".
        expect: A compact Chat thread opens and focus moves to "Mensagem para o Lab Agent".
      - action: Leave the composer empty.
        expect: '"Enviar mensagem" remains disabled.'
      - action: Type "linha um", press Shift+Enter, and type "linha dois".
        expect: The composer contains two lines and remains focused.
      - action: Replace the text with "Diagnostique o trecho autorizado" and press Enter.
        expect: The user message appears and the non-circular signal sweep is exposed as "Execução do stub em andamento" immediately above the composer.
      - action: Wait for the deterministic sequence to finish.
        expect: The sequence reaches preparing context, reading authorized input, Tool Call, Tool Result, and response captured.
      - action: Inspect "Tool Call read_text" and "Tool Result local".
        expect: Only deployment-log-trace is read, the authorized excerpt is visible, and the result is marked Stub local.
      - action: Toggle "Atividade observável".
        expect: Observable milestones expand without exposing private reasoning or hidden grader content.
      - action: Inspect the agent response and composer.
        expect: The response is framed as a stub signal that needs human validation, the composer is empty, and focus returned to it.

  - id: lab-alternate-results
    title: Exercise empty and failure demonstrations
    verification: manual-flow
    steps:
      - action: Select "Vazio", submit a non-empty request, and wait.
        expect: Tool Result states that no authorized local excerpt was found; no real provider is called.
      - action: Select "Falha", submit a non-empty request, and wait.
        expect: Tool Result reports a local read_text failure and the response does not invent evidence.

  - id: adaptive-chat
    title: Inspect every adaptive Chat layout
    verification: chrome-browser-and-vitest
    steps:
      - action: Activate "Abrir Chat" from the lateral dock.
        expect: The compact thread opens with explicit expand, collapse, height, and grip controls.
      - action: Choose Compacta, Meia altura, and Alta.
        expect: The Chat height changes while the primary page remains scrollable.
      - action: Activate "Expandir Chat para inspeção".
        expect: The Chat becomes a wider inspection surface and offers "Reduzir Chat".
      - action: Hold the circular grip for at least 350 ms.
        expect: Snap previews for compact, half, tall, and full-thread placement appear.
      - action: Move while held, then release over one preview.
        expect: The highlighted dock zone is committed; the interaction does not become arbitrary free dragging.
      - action: Focus the grip and press 1, 2, 3, 4, Home, End, ArrowUp, and ArrowDown.
        expect: Every snap state has a keyboard path, with End selecting the full-thread layout.
      - action: Navigate from Lab to Runs with an unsent Chat draft.
        expect: The Chat view and draft persist for the current React session.
      - action: At a 390x844 viewport, open Chat.
        expect: It becomes a bottom sheet with safe-area padding and its bottom edge stays above the mobile navigation.

  - id: projects
    title: Select scope, inspect workflow, and create a local Project
    verification: chrome-browser
    steps:
      - action: Open Projects.
        expect: Project is described as a bounded logical scope and Workspace as a separate local integration concept.
      - action: Select each of the three initial Projects.
        expect: The Project summary and workflow state update without changing the Workspace concept.
      - action: Activate each workflow stage.
        expect: The adjacent inspector answers what happened, what is blocked, and what comes next for the selected Project.
      - action: Open "Criar Project" and submit empty values.
        expect: Required-field validation is shown and the dialog remains open.
      - action: Traverse past the first and last modal control with Shift+Tab and Tab, then press Escape.
        expect: Focus wraps inside the dialog, Escape closes it, and focus returns to "Novo Project".
      - action: Enter "Rollback Signals" with a concise scope and submit.
        expect: The new Project appears and becomes selected only in React state; no backend persistence is implied.

  - id: study-admission
    title: Compile a StudyRevision preview and enforce Admission
    verification: chrome-browser-and-vitest
    steps:
      - action: Open Study.
        expect: Project is locked to Release Integrity for this demonstrative context.
      - action: Select a draft revision and edit the objective.
        expect: The editor identifies the record as StudyRevision, not RunSpec.
      - action: Inspect the execution matrix and compile preview.
        expect: deployment-log-trace is crossed with summary-first and evidence-first, one repetition each, producing two distinct RunSpecs.
      - action: Select "Rejeitada".
        expect: Each exact RunSpec is Rejected, the capability or disclosure reason is operationally stated, and "Enqueue Stub" is disabled.
      - action: Select "Admitida".
        expect: Each exact RunSpec has an admitted AdmissionRecord before enqueue is enabled; no human authority is claimed.

  - id: runs-lifecycle
    title: Progress a stub Run through terminal evidence
    verification: chrome-browser-and-vitest
    steps:
      - action: Open Runs and activate "Start Stub Run".
        expect: The lifecycle starts at Queued and records a separate Run, Job, Attempt, and AdmissionRecord identity.
      - action: Observe the deterministic progression.
        expect: Queued, Preparing, Running, Evaluating, and Terminal are reached in order with factual events only for reached phases; Start remains disabled in flight and commits terminal state atomically.
      - action: Inspect the pause control.
        expect: It is disabled and explicitly marked unsupported.
      - action: Inspect the terminal Evidence area.
        expect: The SubjectEnvelope digest is recorded, while the exact document is described as not persisted or exportable by the prototype.
      - action: Inspect Bundle v2.
        expect: It contains intentional references only and is explicitly non-portable and non-replayable; no locator, blob, restore, or access grant is implied.
      - action: Switch between Loading, Failed, and Completed.
        expect: Each state is visually distinct without using green as a success shortcut; Failed leaves Evaluating reserved, records a failed terminal event, hides completed Evidence, and keeps Start disabled.
      - action: Open "Comparar variantes".
        expect: summary-first and evidence-first can be compared without a balance-scale icon or invented winner.

responsive_checks:
  - viewport: 1440x940
    verification: chrome-browser
    expect:
      - Compact top command rail with Project switcher and four destinations.
      - At most two persistent content zones plus navigation.
      - document.scrollWidth equals document.clientWidth.
  - viewport: 834x1112
    verification: chrome-browser
    expect:
      - Project workflow and inspector remain legible without horizontal clipping.
      - Icon-first command controls retain explicit accessible names and title hints.
      - document.scrollWidth equals document.clientWidth.
  - viewport: 390x844
    verification: chrome-browser
    expect:
      - Four-destination bottom navigation is visible.
      - Route changes start at the top of the new route.
      - Chat bottom sheet stays above navigation.
      - document.scrollWidth equals document.clientWidth.

