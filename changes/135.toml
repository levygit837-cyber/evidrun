interfaces = [
  "LaboratoryAdapter.send mantem assinatura de dois argumentos; o adapter live resolve a sessao internamente para nao arrastar a UI, que pertence a issue 136.",
  "LabAgentLoop.execute preserva assinatura; apenas o evento de erro passa a carregar code e remediation.",
  "build_catalog, build_read_tools, build_proposal_tools e offered_tools permanecem inalterados.",
  "LabAgentStore preserva a superficie publica; list_sessions passa a ordenar pelo ADR 0025 e a traduzir falha de driver.",
]
errors = [
  "A borda HTTP traduz por codigo lendo apenas as tabelas de contracts/lab_agent/errors.py; a traducao vive em um modulo unico compartilhado pelos dois routers.",
  "Codigo de store sem traducao declarada falha alto em vez de virar 500 silencioso.",
  "Indisponibilidade de storage traduz por ScopeErrorCode com 503, nunca por codigo do Lab Agent.",
  "Recusa nomeada de tool volta ao modelo pelo caminho estruturado; apenas falha genuina produz provider_failed.",
]
invariants = [
  "Eventos de interface sao de apresentacao; nenhum caminho emite Event de Run.",
  "Turno parcial nunca e apresentado como completo.",
  "Alvo ausente e alvo de outro Workspace produzem codigo, categoria, status e forma de payload identicos.",
  "Listar sessoes exige workspace_id; Workspace inexistente devolve lista vazia.",
  "CLI e API projetam o mesmo documento de sessao, a partir de LabSession.document.",
  "O streaming emite a tool comecando e terminando, nao apenas a resposta final.",
  "Cancelamento interrompe em fronteira segura e preserva draft ja registrado.",
  "A instrucao de sistema permanece vazia; sua composicao e a issue 134.",
]

