[[questions]]
text = "A recusa nomeada de tool devia continuar chegando ao humano como provider_failed?"
affects_semantics = true
status = "resolved"
resolution = "Nao. O criterio de aceitacao exige recusa traduzida por codigo nas duas bordas, e serving.py capturava Exception generica, apresentando argumento invalido como falha de infraestrutura. LabToolRejected passou a viver em lab/protocol.py, que e a costura entre laco e tools, e o laco a roteia por refuse_and_maybe_terminate."

[[questions]]
text = "A combinacao invalida de scope devia recusar com scope.focus_mismatch?"
affects_semantics = true
status = "resolved"
resolution = "Nao. focus_mismatch e categoria not_found para preservar a indistinguibilidade de alvo e devolveria 404 para um corpo malformado. Combinacao invalida e defeito estrutural do documento, que o cliente corrige, portanto schema.argument_set_invalid com 422."

[[questions]]
text = "O turno devia expor um endpoint proprio de cancelamento?"
affects_semantics = true
status = "resolved"
resolution = "Nao. O aborto do fetch fecha a conexao e ja identifica exatamente o turno em voo. Um endpoint separado criaria uma segunda identidade de cancelamento sem tornar a tool interrompivel."

