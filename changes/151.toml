  ".github/**",
  "alembic/**",
  "apps/**",
  "docs/adr/**",
  "docs/contracts/**",
  "schemas/**",
  "scripts/**",
  "src/**",
  "tests/**",
]
preexisting = []

[preserve]
interfaces = [
  "CLI, API, contratos, eventos e formatos persistidos permanecem inalterados.",
]
errors = [
  "Nenhum codigo, categoria, status HTTP ou exit code e alterado.",
]
invariants = [
  "Roadmap nao e descrito como comportamento implementado.",
  "Resultados de runs nao viram fatos sem referencia verificavel.",
  "O README preserva os limites declarados do runtime atual.",
]

[verification]
focused = [
  "git diff --check",
  "uv run python scripts/check_change_contract.py --contract changes/151.toml --strict-warnings",
]
