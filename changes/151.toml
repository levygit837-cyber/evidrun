schema_version = "1"
change_id = "GH-151"
issue = 151
title = "Alinhar o README com a evidencia publica do portfolio"
classification = "docs-only"
base_ref = "origin/main"
branch_pattern = "agent/readme-portfolio-*"
expected_outcome = "O README apresenta o Evidrun com navegacao clara e linguagem consistente com o portfolio, sem alterar comportamento, contratos ou capabilities."
confirmed_facts = [
  "O diff de entrega altera somente README.md.",
  "Os comandos, limites e contagens tecnicas ja existiam no README da branch principal; esta mudanca reorganiza a entrada visual e corrige acentuacao.",
  "Nenhum contrato, ADR, schema, runtime, teste ou codigo de aplicacao e alterado.",
]
stop_conditions = [
  "A edicao exigir promover capability, mudar contrato normativo ou afirmar resultado nao sustentado pelo repositorio.",
  "O diff incluir qualquer arquivo de codigo, schema, migration, workflow ou contrato persistido.",
]

[impact]
capability = "none"
persisted_contract = "none"
normative = "none"
notes = [
  "README.md e documentacao de entrada, nao uma superficie normativa do Evidrun.",
]

