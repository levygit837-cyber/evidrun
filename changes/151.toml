[merge_gate.spec]
conclusion = "passed"
evidence = ["diff:README.md"]

[merge_gate.standards]
conclusion = "passed"
evidence = ["review:PR#151"]

[merge_gate.verification]
conclusion = "passed"
evidence = ["log:git-diff-check"]

[merge_gate.ci]
conclusion = "passed"
evidence = ["run:actions/0"]

