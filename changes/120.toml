patterns = ["docs/_generated/**"]
source_patterns = ["docs/**/*.md"]

[preserve]
interfaces = [
  "`check_resource_budgets.py` mantem `--root`, `--config`, `--profile`, `--base-ref`, `--format` e `--json-out`.",
  "Os tres estados do criterio de #48 continuam nomeados: regressao, ruido/inconclusivo e medicao indisponivel.",
  "`[[policy_adjustments]]`, `[[baseline_adjustments]]` e `[[limit_adjustments]]` mantem forma e campos.",
]
errors = [
  "Exit 0 cobre medicoes OK, regressoes warning-only, ruido inconclusivo e indisponibilidade warning-only; exit 1 e violacao deterministica; exit 2 e configuracao ou medicao obrigatoria indisponivel.",
]
invariants = [
  "Tempo e memoria nunca bloqueiam, inclusive quando indisponiveis.",
  "Registro que ja existia no merge-base nao autoriza a mudanca deste diff.",
  "O lado do merge-base decide sozinho se um limite existia; sair de `blocking` nao retira o limite antigo sem registro proprio.",
  "Guarda de ruido se aplica somente a grandeza amostrada; quantidade exata nunca e reportada como inconclusiva.",
  "Nenhuma mensagem de skip afirma cobertura que o CI nao fornece.",
]

[verification]
focused = [
  "uv run pytest tests/unit/test_resource_budget.py tests/unit/test_resource_budget_policy.py",
  "uv run python scripts/check_resource_budgets.py --profile python --base-ref origin/main",
  "pnpm build && uv run python scripts/check_resource_budgets.py --profile build --base-ref origin/main",
]
full_gates = [
  "uv run pytest",
  "uv run ruff check .",
  "uv run python scripts/check_code_budget.py",
  "uv run pyright",
  "pnpm typecheck:web",
  "pnpm typecheck:desktop",
  "pnpm test",
  "pnpm build",
  "uv run python scripts/validate_docs.py",
]

[[questions]]
text = "Elevar `repetitions` para 5 ou trocar a dispersao por amplitude relativa?"
affects_semantics = true
status = "resolved"
resolution = "Amplitude relativa. Elevar repeticoes multiplicaria o custo de CI de cada cenario sem resolver a cegueira: em n=5 a MAD ganha alguma resolucao, mas continua descartando o extremo, que e exatamente o sinal procurado. Amplitude e pessimista de proposito, e para sinal warning-only essa e a direcao segura, porque a consequencia de exagerar ruido e `inconclusive`, nunca build vermelho."

[[questions]]
text = "O guarda de ruido deve valer para toda metrica warning repetida?"
affects_semantics = true
status = "resolved"
resolution = "Nao. Um teste preexistente pegou a regressao: `bundle.output_bytes`, inventario exato de uma amostra, passou a `inconclusive` quando o caminho foi unificado. Amostra unica de quantidade exata nao e dispersao desconhecida, e a diferenca nao e o tamanho da amostra, e a grandeza ser amostrada ou lida."

[[questions]]
text = "Corrigir os Latentes 6 e 7 editando `changes/48.toml`?"
affects_semantics = true
status = "resolved"
resolution = "Nao. Verificado que `check_change_contract.py --discover` retorna exit 2 com dois contratos no diff, e o CI roda exatamente esse comando com `--strict-warnings`. O precedente e a #118, que corrigiu achados pos-merge da #51 sem reescrever `changes/51.toml`. Os dois achados ficam registrados neste contrato: a variacao real de `bundle_bytes` (19227 -> 19237) esta em `confirmed_facts`, e a referencia das revisoes reais e esta issue."

[[questions]]
text = "`unavailable` deve continuar sendo exit 2 sempre?"
affects_semantics = true
status = "resolved"
resolution = "Nao. Metrica bloqueante indisponivel continua exit 2, porque o gate ficaria sem a protecao que declara ter. Metrica warning-only indisponivel e reportada e nada mais, coerente com `[preserve].invariants` de #48, que ja dizia que tempo e memoria nunca bloqueiam."

