schema_version = "1"
change_id = "GH-120"
issue = 120
title = "Corrigir a prova de execucao dos budgets de recursos"
classification = "behavior-compatible"
base_ref = "origin/main"
branch_pattern = "fix/issue-120-resource-budget-proof"
expected_outcome = "O workload real de build roda num job de CI; ferramenta ausente produz metrica `unavailable` com JSON emitido e nao derruba metrica warning-only; o guarda de ruido enxerga uma amostra 10x fora com `repetitions = 3`; reautorizar a mesma transicao de limite exige registro novo; e a doc declara por que o baseline e hand-authored."
confirmed_facts = [
  "Ativo 1 verificado em main: `uv run pytest` aparecia 0 vezes no job node e `setup-node`/`pnpm/action` 0 vezes no job python, entao o workload real de build nao era exercido em lugar nenhum.",
  "Ativo 2 reproduzido: cenario cuja unica metrica e `timing` warning-only, com PATH sem `pnpm`, dava exit 2 com stdout vazio e traceback como CONFIG ERROR.",
  "Ativo 3 medido no perfil real: `crl_ctx_002.duration_ms` reportava MAD relativa 0.0000 contra amplitude verdadeira 0.0531; a amostra sintetica (100, 101, 1000) marcava MAD 0.0099 e amplitude 8.9109.",
  "Latente 4 reproduzido: com `[[limit_adjustments]]` historico presente no merge-base, subir `limit = 8` para `16` sem registro novo dava exit 0 com stderr vazio; medicao de 12 bytes excedia o limite antigo.",
  "Achado adicional encontrado durante a correcao: `_check_global_policy_field` passava `None` cru para o registro exigido, e TOML nao tem null, entao adicionar campo de metodologia era inautorizavel. Reproduzido com `methodology.statistic absent -> median`.",
  "Latente 7 confirmado por execucao: `run_bundle.bundle_bytes` deu 19227 e 19237 em duas execucoes do mesmo checkout, porque o zip carrega ids e timestamps.",
  "Ambos os perfis reais ficam verdes com o base-ref vinculado: python 16 ok, build 10 ok, exit 0 em cada um.",
  "Segundo achado, encontrado pela propria CI na run 30677998626: fechar a porta do subprocesso nao bastava. `measurement_environment` roda `node --version` no processo pai, e `check=False` suprime exit code nao-zero mas nao o `FileNotFoundError` de binario ausente, entao o runner sem `node` no PATH restrito abortava antes de qualquer JSON. Reproduzido depois com `git` ausente: sem o `try/except`, a mesma classe de falha volta.",
  "O teste do Ativo 2 usava PATH `/usr/bin:/bin`, que tem `node` numa maquina de dev e nao tem no runner, entao afirmava fato diferente em cada lugar. Trocado por diretorio vazio: todo binario procurado esta ausente em qualquer ambiente.",
]
stop_conditions = [
  "Promover threshold novo a bloqueante: continua fora de escopo, como em #48. Tempo e memoria seguem warning-only.",
  "Reescrever `changes/48.toml` para corrigir os Latentes 6 e 7: o gate de contrato recusa dois contratos ativos no mesmo diff com exit 2, verificado nesta worktree. Precedente do repo e da #118, que corrigiu achados pos-merge da #51 registrando-os no proprio contrato sucessor sem reescrever `changes/51.toml`, coerente com a regra de ADR sucessor em AGENTS.md. Os dois achados ficam registrados aqui.",
  "Adicionar `--update-baseline` ao checker: decidido pelo caminho oposto, que a doc agora declara. Medicao depende de maquina e de build real, entao recomputar em qualquer checkout gravaria o ambiente de quem rodou como se fosse politica acordada.",
]

[impact]
capability = "changed"
persisted_contract = "none"
normative = "changed"
notes = [
  "`methodology.noise_mad_ratio` passa a `noise_spread_ratio` e `dispersion` muda de texto. Os dois estao registrados em `[[policy_adjustments]]` no proprio `resource-budget.toml`, com a medicao que motivou a troca. O limiar sobe de 0.20 para 0.60 porque amplitude relativa e grandeza mais larga que MAD: a pior metrica warning real fica em 0.2424 e um outlier 10x marca 8.9109.",
  "O guarda de ruido passa a se aplicar somente a classificacao `timing` e `memory`. Contagem e bytes lidos do artefato pronto sao exatos; chama-los de inconclusivos esconderia fato que o checker possui. Um teste preexistente pegou essa regressao quando o caminho estava unificado.",
  "`unavailable` deixa de ser alcancavel so por `path_inventory`: falha de subprocesso por ferramenta ausente vira metrica com `reason`, JSON emitido, e exit code seguindo a regra que ja existia. `unavailable` bloqueia apenas quando a metrica e bloqueante, porque so ai o gate fica sem a protecao que declara ter.",
  "`docs/governance/resource-budgets.md` corrige a afirmacao de MAD, declara a convencao `absent`/`removed`, registra a provenance hand-authored e ancora `verification_valid` nos tres eixos do verificador, sem prometer portabilidade nem replay.",
  "`changes/48.toml` permanece intacto de proposito; os Latentes 6 e 7 estao corrigidos como fato registrado neste contrato, em `confirmed_facts` e nas notas acima.",
]

