patterns = ["docs/_generated/manifest.json", "docs/_generated/claims.json"]
source_patterns = ["docs/**"]

[preserve]
interfaces = [
  "CatalogStore permanece separado do agregado LabAgentStore.",
  "O event ledger e os bundles não recebem linhas de rastro do Lab Agent.",
]
errors = [
  "Alvo inexistente e alvo fora do escopo usam lab.target_not_visible.",
  "Scope legado ambíguo interrompe a migração nomeando a linha.",
]
invariants = [
  "Scope da sessão é imutável.",
  "Mensagem é append-only e sua sequência é monotônica sem lacuna.",
  "Nenhum Project é inferido de texto legado.",
  "arguments_digest é canônico e argumentos brutos não são persistidos.",
]

[verification]
focused = [
  "uv run pytest tests/integration/test_lab_agent_store.py tests/integration/test_lab_agent_session_migration.py",
  "uv run pytest tests/integration/test_lab_agent_session_migration.py",
]
full_gates = [
  "uv run pytest",
  "uv run ruff check .",
  "uv run python scripts/check_code_budget.py",
  "uv run python scripts/check_import_directions.py",
  "uv run pyright",
  "pnpm typecheck:web",
  "pnpm typecheck:desktop",
  "pnpm test",
  "pnpm build",
  "uv run python scripts/validate_docs.py",
]

[breaking]
justification = "O schema legado sem escopo tipado aceita estados ambíguos; a migração precisa adicionar campos obrigatórios e rejeitar dados que não possam ser resolvidos sem ampliar autoridade."
strategy = "migration"
versioning = "A migration 0008 converte integralmente o schema legado; não há janela com escrita simultânea nos dois shapes."
