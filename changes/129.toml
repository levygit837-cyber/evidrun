schema_version = "1"
change_id = "GH-129"
issue = 129
title = "Store tipado de sessão, mensagem e rastro do Lab Agent"
classification = "breaking"
base_ref = "origin/main"
branch_pattern = "*issue-129-lab-agent-session-store"
expected_outcome = "Sessões do Lab Agent têm escopo tipado e validado, mensagens append-only ordenadas e rastro de tool separado do event ledger."
confirmed_facts = [
  "O storage legado usava scope_type e scope_id livres e anuláveis.",
  "A validação de pertencimento precisa ocorrer tanto na escrita quanto na leitura.",
  "Requested refs e returned refs separados preservam a tentativa recusada.",
]
stop_conditions = [
  "A migração precisar inferir Project de título ou conteúdo de mensagem.",
  "O rastro de tool precisar ser gravado no event ledger.",
  "O store precisar integrar CatalogStore ou importar contratos da issue 130.",
]

[impact]
capability = "additive"
persisted_contract = "breaking"
normative = "none"
notes = [
  "Adiciona colunas tipadas às sessões, sequência às mensagens e tabela própria de rastros.",
  "Mantém as colunas legadas nullable para consumidores existentes, sem usá-las no novo store.",
]

[scope]
expected = [
  "alembic/versions/0008_lab_agent_session_store.py",
  "changes/129.toml",
  "src/evidrun/infrastructure/database/lab.py",
  "src/evidrun/infrastructure/database/lab_errors.py",
  "src/evidrun/infrastructure/database/models.py",
  "src/evidrun/infrastructure/database/repository.py",
  "tests/integration/test_lab_agent_session_migration.py",
  "tests/integration/test_lab_agent_store.py",
  "tests/fixtures/lab_agent_session_store_v0007.sql",
  "tests/integration/test_contract_migration.py",
  "tests/integration/test_execution_trust_migration.py",
]
forbidden = [
  "AGENTS.md",
  "CONTEXT.md",
  "apps/**",
  "docs/adr/**",
  "docs/contracts/**",
  "src/evidrun/contracts/**",
  "src/evidrun/entrypoints/**",
  "src/evidrun/infrastructure/database/catalog.py",
  "src/evidrun/infrastructure/database/read_model/**",
]
preexisting = []

