[[questions]]
text = "Como manter o catálogo de rejeições ativo sincronizado com os checkers de admissão?"
affects_semantics = true
status = "resolved"
resolution = "A fonte inspeciona os checkers e o RuntimeCapabilityEnvelope; não mantém uma lista manual paralela de códigos."

[[questions]]
text = "Focused chat deveria oferecer tools adicionais ao Project chat?"
affects_semantics = true
status = "resolved"
resolution = "Não. Focused oferece o mesmo catálogo do Project e apenas estreita o conjunto visível de Study, Run ou Comparison."
