schema_version = "1"
change_id = "GH-48"
issue = 48
title = "Medir budgets de performance e recursos antes de bloquear"
classification = "feature"
base_ref = "origin/main"
branch_pattern = "agent/issue-48-resource-budgets"
expected_outcome = "Cenários reais e reproduzíveis medem duração, pico RSS, tamanhos e contagens; ruído e indisponibilidade são explícitos, enquanto somente limites determinísticos acordados bloqueiam."
confirmed_facts = [
  "O CRL-CTX-002 executa offline pelo Runtime Kernel e produz duas Runs, uma Comparison, dezoito eventos e seis artifacts neste baseline (run:local/resource-calibration@issue-48).",
  "Runs novas possuem Execution Trust e usam Evidence Bundle v4; o v3 rejeita corretamente Runs com trust e não pode ser fabricado como caminho novo apenas para satisfazer um benchmark antigo.",
  "O build atual produz quatro raízes determinísticas: apps/web/dist, apps/desktop/dist/main, apps/desktop/dist/preload e apps/desktop/dist/shared (run:local/resource-calibration@issue-48).",
]
stop_conditions = [
  "Transformar duração ou memória em gate bloqueante nesta entrega; a Issue exige observação e warnings antes de qualquer promoção.",
  "Incluir .venv, node_modules, caches de teste ou caches de bundler nos tamanhos gerados.",
  "Criar Run legada sem Execution Trust fora do adapter canônico apenas para produzir um Bundle v3.",
]

[impact]
capability = "additive"
persisted_contract = "none"
normative = "additive"
notes = [
  "A capability é tooling de desenvolvimento e CI; contratos, schemas e runtime de produção não mudam.",
  "O documento normativo novo declara exatamente quais medições bloqueiam e quais apenas informam.",
]

[scope]
expected = [
  ".github/workflows/ci.yml",
  "changes/48.toml",
  "docs/governance/resource-budgets.md",
  "docs/operations/local-development.md",
  "resource-budget.toml",
