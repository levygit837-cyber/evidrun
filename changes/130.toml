[[questions]]
text = "O catalogo do Lab Agent deve estender TriageErrorCode?"
affects_semantics = true
status = "resolved"
resolution = "Nao. Recusar uma tool call de copiloto nao e uma das seis fases que antecedem uma Run, e observable-errors.md ja registra por que TriageError e ScopeError sao separados entre si. O Lab Agent e uma terceira costura, com enum, tabelas e validador proprios."

[[questions]]
text = "Alvo inexistente e alvo de outro Project devem ter codigos distintos?"
affects_semantics = true
status = "resolved"
resolution = "Nao, e isso e normativo. Codigos distintos transformariam a recusa num oraculo de existencia: bastaria pedir um id e ler o codigo de volta. Os tres casos compartilham codigo, categoria, status e forma de payload, e a traducao HTTP e por categoria justamente para que nenhum status separe os casos."

[[questions]]
text = "O envelope deve declarar refs de memoria recuperada?"
affects_semantics = true
status = "resolved"
resolution = "Nao nesta entrega. A capability de memoria nao existe, e declarar o campo anunciaria retrieval que nenhum runtime executa. O contrato de memoria v2 reserva o lugar, e o catalogo de tools aceita capability nova sem mudar assinatura."

[[questions]]
text = "Os modelos do Lab Agent entram em CONTRACT_MODELS?"
affects_semantics = false
status = "resolved"
resolution = "Nao. A allowlist e explicita e nao auto-descoberta; ela publica schema de superficie existente. Nenhuma superficie publica consome esses tipos ainda, portanto schemas/generated/** permanece inalterado e a entrada e adicionada pela issue que criar o runtime."

[[questions]]
text = "Um unico arquivo lab_agent.py cabe no orcamento?"
affects_semantics = false
status = "resolved"
resolution = "Nao com folga: 21 codigos, tres tabelas, envelope, scope e erro juntos passariam de 500 linhas ou ficariam no limiar do aviso. O pacote foi decomposto por assunto seguindo contracts/runtime/, sem entrada em [baseline]."
