confirmed_facts = [
  "contracts/triage.py e contracts/scope.py sao os dois precedentes de catalogo executavel: enum prefixado, CATEGORY_BY_CODE, HTTP_STATUS_BY_CODE e CLI_EXIT_BY_CODE como MappingProxyType, mais um validador de totalidade chamado no import do modulo.",
  "TriageError.remediation e opcional (triage.py:93); LabAgentError.remediation e obrigatoria porque o leitor primario da recusa e o modelo dentro do laco.",
  "scripts/check_import_directions.py:15 proibe fastapi, sqlalchemy, openai, electron e react em src/evidrun/contracts/**; o pacote novo importa apenas pydantic, enum, types e evidrun.contracts.base/shared.",
  "ArtifactRef (base.py:95) nao possui locator, e ContractModel usa extra=forbid, portanto reintroduzir path, URL ou storage locator no envelope falha na validacao.",
  "code-budget.toml define max_file_lines = 500 para src/**/*.py com baseline vazio; o catalogo foi decomposto em lab_agent/{scope,envelope,errors}.py seguindo o precedente de contracts/runtime/.",
  "contracts/runtime/__init__.py nao reexporta nada: um nome tem exatamente uma casa. lab_agent/__init__.py segue a mesma regra e os nomes publicos entram apenas na fachada contracts/__init__.py.",
  "generate_schemas.py:49 tem allowlist explicita CONTRACT_MODELS; nenhum modelo do Lab Agent entra nela porque nenhum runtime publica esses schemas ainda, portanto schemas/generated/** nao muda.",
  "A issue #129 persiste um shape equivalente ao scope na infraestrutura sem importar este pacote; a fonte de verdade compartilhada e o doc e focus_kind vale exatamente study, run e comparison.",
]
stop_conditions = [
  "A entrega exigir runtime, laco, executor ou tool do Lab Agent.",
  "Um codigo distinto ser necessario para separar alvo inexistente de alvo de outro escopo, o que tornaria a recusa um oraculo de existencia.",
  "O envelope precisar de locator, bytes de Artifact, credencial ou authority para ser util.",
  "O catalogo precisar estender TriageErrorCode ou ScopeErrorCode em vez de ser costura propria.",
]

