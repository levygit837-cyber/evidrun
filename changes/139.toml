[[questions]]
text = "O turno de framing deve entrar no runtime decidido do Lab Agent?"
affects_semantics = true
status = "resolved"
resolution = "Nao. A decisao explicita do usuario foi tornar o framing um experimento validavel em vez de decisao de projeto. O ADR 0024 permanece sem ele, e o dossier registra a hipotese com authority research."

[[questions]]
text = "reasoning.effort por turno resolveria o problema de forcar mais raciocinio?"
affects_semantics = false
status = "resolved"
resolution = "Nao sozinho. Effort aprofunda o passe existente e nao cria um segundo; forcar passe adicional exige recusar o terminal. Tornar effort sobreponivel por request e melhoria separada, fora deste dossier."
