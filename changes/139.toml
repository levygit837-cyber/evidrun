schema_version = "1"
change_id = "GH-139"
issue = 139
title = "Registrar a hipotese do turno de framing como research"
classification = "docs-only"
base_ref = "origin/main"
branch_pattern = "docs/framing-turn-hypothesis"
expected_outcome = "A hipotese do turno de framing existe como dossier de research com variavel primaria isolada, confounders declarados e dependencias ausentes nomeadas, sem alterar nenhum contrato ou ADR e sem afirmar ganho de qualidade."
confirmed_facts = [
  "ResponsesReadAgentAdapter._terminal_result recusa resposta terminal quando state.tool_calls == 0, portanto o repositorio ja possui precedente de recusar terminal que nao fez o trabalho.",
  "OpenAIResponsesProvider.invoke monta reasoning a partir de self.profile.reasoning_effort e nao inclui reasoning na tupla de campos repassados do request, logo o effort nao e sobreponivel por chamada.",
  "ProviderProfile.load_default resolve reasoning_effort de EVIDRUN_PROVIDER_REASONING_EFFORT com default max.",
  "Os cinco budgets de lab-agent-loop-v1 sao tetos: max_tool_calls_per_turn, max_provider_round_trips_per_turn, max_wall_seconds_per_turn, max_refusals_per_turn e max_output_tokens_per_round_trip. Nenhum e piso.",
  "A admissao rejeita max_turns > 1 porque nao existe coordinator de turnos, portanto o experimento nao e executavel hoje.",
  "docs/planning/comfortable-minimum.md ja nomeia a tensao de que sem multi-turn o corredor entrega o laboratorio e nao entrega o experimento que o justifica.",
  "docs/research/ ja usa authority research com volatility snapshot, observed_at e review_due; o dossier segue esse padrao existente.",
]
stop_conditions = [
  "O dossier precisar alterar o ADR 0024 ou qualquer contrato v1 do Lab Agent.",
  "O registro exigir afirmar que o turno de framing melhora qualidade sem Study que meca.",
  "A hipotese precisar promover capability ou relaxar a rejeicao de max_turns > 1.",
]

