[merge_gate.ci]
conclusion = "passed"
evidence = ["run:local-full-gates-on-ci_commit"]

[[questions]]
text = "Workspace inexistente deve produzir 404 ou lista vazia?"
affects_semantics = true
status = "resolved"
resolution = "Lista vazia. A listagem não resolve um alvo e deve tornar indistinguíveis Workspace ausente e Workspace sem sessões, evitando oráculo de existência."

[[questions]]
text = "O dashboard global deve filtrar chats ou remover a coleção?"
affects_semantics = true
status = "resolved"
resolution = "Remove a coleção. O dashboard não recebe Workspace para derivar filtro, e fingir um default violaria a fronteira normativa."
