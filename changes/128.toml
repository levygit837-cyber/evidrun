[[scope.generated]]
patterns = ["schemas/generated/**"]
source_patterns = [
  "src/evidrun/entrypoints/api/**",
  "src/evidrun/entrypoints/api/schemas.py",
  "scripts/generate_schemas.py",
]

[preserve]
interfaces = [
  "POST /api/v1/chat/sessions continua aceitando workspace_id, title, scope_type e scope_id.",
  "POST /api/v1/chat/sessions/{session_id}/messages preserva status e documento de resposta.",
  "A projeção de uma sessão preserva id, workspace_id, scope_type, scope_id, title e created_at.",
]
errors = [
  "GET /api/v1/chat/sessions sem workspace_id é recusado pelo FastAPI com status 422.",
  "Workspace inexistente na listagem produz lista vazia e não revela sua existência por 404.",
]
invariants = [
  "Nenhuma sessão de outro Workspace aparece na listagem da API ou da CLI.",
  "O dashboard global não contém chats nem outra agregação de sessões entre Workspaces.",
  "A listagem tem ordem estável por created_at descendente e id como desempate.",
  "Shape tipado de scope, role, sequence, migração e rastro de tool permanecem fora desta mudança.",
]

[verification]
focused = [
  "uv run pytest tests/integration/test_chat_workspace_scope.py",
]
full_gates = [
  "uv run pytest",
  "uv run ruff check .",
  "uv run python scripts/check_code_budget.py",
  "uv run python scripts/check_import_directions.py",
  "uv run pyright",
  "pnpm typecheck:web",
  "pnpm typecheck:desktop",
  "pnpm test",
  "pnpm build",
  "uv run python scripts/validate_docs.py",
  "uv run python scripts/check_change_contract.py --discover --base-ref origin/main --strict-warnings",
]

[breaking]
justification = "A leitura global viola a hard boundary de Workspace; preservar compatibilidade manteria o vazamento ativo por API, CLI ou dashboard."
strategy = "migration"
versioning = "A API v1 e a CLI fazem corte limpo: callers passam workspace_id explicitamente, e consumidores deixam de esperar chats no dashboard global."
adr_successors = []
previous_artifact_tests = ["uv run pytest tests/integration/test_chat_workspace_scope.py"]
previous_artifact_fixtures = ["tests/integration/fixtures/chat-sessions-unscoped-openapi-v1.json"]

[merge_gate]
review = "orthogonal"
