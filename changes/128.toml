schema_version = "1"
change_id = "GH-128"
issue = 128
title = "Listagem de chat limitada ao Workspace"
classification = "breaking"
base_ref = "origin/main"
branch_pattern = "levygit837-cyber/issue-128-chat-session-workspace-scope"
expected_outcome = "API e CLI listam sessões somente do Workspace explícito, e o dashboard global deixa de expor chats."
confirmed_facts = [
  "A listagem de chat usava latest_dashboard e devolvia sessões de todos os Workspaces.",
  "O dashboard global projetava a mesma coleção sem filtro por Workspace.",
  "Nenhum consumidor TypeScript acessa dashboard.chats.",
  "O contrato de store exige workspace_id em toda leitura de sessões.",
]
stop_conditions = [
  "A correção exigir alterar o shape tipado de scope ou a migração de storage reservados à issue 129.",
  "A UI possuir consumidor real de dashboard.chats que não possa migrar dentro da superfície autorizada.",
]

[impact]
capability = "breaking"
persisted_contract = "changed"
normative = "none"
notes = [
  "GET /api/v1/chat/sessions ganha workspace_id obrigatório e deixa de aceitar leitura global.",
  "chat list ganha --workspace-id obrigatório e passa a refletir a mesma projeção escopada da API.",
  "GET /api/v1/dashboard remove chats porque o agregado global não possui Workspace pelo qual filtrar conteúdo de usuário.",
  "schemas/generated/openapi-v1.json muda de forma breaking ao declarar o query param obrigatório.",
  "A implementação passa a cumprir os contratos normativos existentes sem alterar sua decisão.",
]

[scope]
expected = [
  "apps/web/src/types.ts",
  "changes/128.toml",
  "schemas/generated/**",
  "src/evidrun/entrypoints/api/routers/evidence.py",
  "src/evidrun/entrypoints/api/routers/platform.py",
  "src/evidrun/entrypoints/cli/commands/runs.py",
  "src/evidrun/infrastructure/database/read_model/dashboard.py",
