  "tests/integration/fixtures/chat-sessions-unscoped-openapi-v1.json",
  "tests/integration/test_chat_workspace_scope.py",
]
forbidden = [
  "AGENTS.md",
  "CONTEXT.md",
  "alembic/**",
  "docs/adr/**",
  "docs/contracts/**",
  "src/evidrun/contracts/**",
  "src/evidrun/infrastructure/database/catalog.py",
  "src/evidrun/infrastructure/database/models.py",
  "src/evidrun/infrastructure/database/repository.py",
]
preexisting = []

