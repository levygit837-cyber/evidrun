[[questions]]
text = "O Lab Agent pode solicitar uma admissao para ler a rejeicao real?"
affects_semantics = true
status = "resolved"
resolution = "Nao. AdmissionRecord e record persistido, e produzir efeito persistido para descobrir uma resposta transforma diagnostico em escrita. O agente le admissoes existentes e explica o codigo exato; solicitar admissao pertence ao humano pela superficie publica."

[[questions]]
text = "O runtime deve detectar laco de tool call por heuristica de similaridade?"
affects_semantics = true
status = "resolved"
resolution = "Nao. Similaridade produziria um limite que ninguem consegue declarar nem testar. A decisao e recusa determinista com remediacao obrigatoria, mais terminal por repeticao exata de tool, argumentos e codigo de recusa."

[[questions]]
text = "O Lab Agent deve executar Python para raciocinar sobre metricas?"
affects_semantics = true
status = "resolved"
resolution = "Nao nesta decisao. Uma superficie de execucao no Control Plane exigiria modelo de isolamento, policy e auditoria proprios. Agregacao declarativa tipada entrega o caso de uso com determinismo e amostra obrigatoria; um ADR sucessor pode revisitar se aparecer caso que ela nao expresse."

[[questions]]
text = "A instrucao de sistema deve ser um texto por tipo de sessao?"
affects_semantics = true
status = "resolved"
resolution = "Nao. Tres textos divergem e uma invariante corrigida em dois deles e defeito silencioso. A decisao e composicao: base invariante mais um bloco de escopo mais um bloco de capabilities derivado do catalogo efetivo."
