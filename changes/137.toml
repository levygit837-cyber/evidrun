  "O Lab Agent nao existe em src/evidrun/; glob por lab_agent e chat em src/evidrun nao retorna modulo de runtime.",
  "ResponsesReadAgentAdapter.execute exige SubjectEnvelope, exige trace_sink nao nulo, deriva o teto de envelope.budgets.max_tool_calls e valida exatamente uma capability resolvida; os quatro sao acoplamento ao Execution Plane.",
  "ChatSessionRow.scope_type e scope_id sao String anulaveis sem enum nem chave estrangeira, e create_chat_session os aceita como texto livre.",
  "O GET /api/v1/chat/sessions devolve latest_dashboard()['chats'], cujo select(ChatSessionRow) nao possui WHERE; chat_document projeta workspace_id.",
  "Nenhum teste cobre os endpoints de chat: grep por chat em tests nao retorna match.",
  "productionLaboratoryAdapter recusa send/stream/cancel com source integration_pending.",
  "O tipo LabUiEvent em apps/web/src/data/contracts.ts declara status, tool, message, error e done, com resumo de argumento e resultado na tool.",
  "TriageError.validate_code_phase exige prefixo do codigo igual a phase, e validate_error_tables falha quando um codigo fica sem entrada nas duas tabelas.",
  "save_contract_revision aceita apenas draft ou proposed como status inicial e nao toca decide_contract_revision.",
  "A admissao rejeita hoje progress policy, checkpoint_policy, goal mode fora de goal_state, mais de um stage de evaluation, adjudicacao humana verificada, disclosure diferente de none, budgets nao suportados e stop conditions fora do par terminal.",
]
stop_conditions = [
  "A documentacao exigir reescrever o ADR 0018 ou o ADR 0021 em vez de suceder uma decisao.",
  "Uma decisao registrada exigir promover capability ou alterar o que a admissao aceita.",
  "Um contrato precisar afirmar comportamento implementado que nao existe em src/evidrun/.",
]

