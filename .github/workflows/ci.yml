name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run python scripts/check_secrets.py
      - run: uv run ruff check .
      - run: uv run python scripts/check_change_contract.py --discover --base-ref origin/main --strict-warnings
      - run: uv run python scripts/check_import_directions.py
      # Warning-only by design: the script exits 0 whatever it finds, so a growing
      # fan-in or a new cycle informs a reviewer without blocking the merge.
      # `continue-on-error` is deliberately NOT used: it would also mask a crash.
      - run: uv run python scripts/check_dependency_report.py --base-ref origin/main --json-out dependency-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: dependency-report.json
      # Duration and peak RSS are warning-only. Stable record counts still fail
      # when the canonical offline scenario no longer has the agreed shape.
      - run: uv run python scripts/check_resource_budgets.py --profile python --base-ref origin/main --json-out python-resource-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-resource-report
          path: python-resource-report.json
      - run: uv run python scripts/check_code_budget.py
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/validate_docs.py
      - run: uv run python scripts/generate_schemas.py --check
      - run: git diff --exit-code -- docs/_generated

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate_contract_types.mjs --check
      - run: pnpm typecheck:web
      - run: pnpm typecheck:desktop
      - run: pnpm test:web
      - run: pnpm test:desktop
      - run: pnpm build
      # The smokes spawn the real sidecars through `uv run`, so this job needs Python too.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --extra dev
      # `pnpm` only exists in this job, so this is the only place the real build
      # workload is exercised. The python job skips it, and a skip there must never be
      # mistaken for coverage.
      - run: uv run pytest tests/unit/test_resource_budget.py
      # This profile repeats the real build three times for warning-only timing/RSS,
      # then inventories its four output roots. Stable counts/bytes are blocking.
      - run: uv run python scripts/check_resource_budgets.py --profile build --base-ref origin/main --json-out build-resource-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-resource-report
          path: build-resource-report.json
      - run: pnpm test:handshake
      # Guards blocker B2: fails if a Run enqueued with no terminal involved never reaches
      # a terminal state, which is what happens when nothing supervises the executor.
      - run: pnpm test:supervision
