name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run python scripts/check_import_directions.py
      - run: uv run python scripts/check_code_budget.py
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/validate_docs.py
      - run: uv run python scripts/generate_schemas.py --check
      - run: git diff --exit-code -- docs/_generated

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate_contract_types.mjs --check
      - run: pnpm typecheck:web
      - run: pnpm typecheck:desktop
      - run: pnpm test:web
      - run: pnpm test:desktop
      - run: pnpm build
