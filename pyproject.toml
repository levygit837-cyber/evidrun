[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidrun"
version = "0.1.0"
description = "Local-first, auditable context reliability laboratory for AI agents."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Evidrun contributors" }]
dependencies = [
  "alembic>=1.16.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "keyring>=25.6.0",
  "platformdirs>=4.3.0",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "sqlalchemy>=2.0.41",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.135.0",
  "pyright>=1.1.402",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]
package = ["pyinstaller>=6.14.0"]

[project.scripts]
evidrun = "evidrun.entrypoints.cli.app:main"
evidrun-api = "evidrun.entrypoints.api.app:run"
evidrun-worker = "evidrun.entrypoints.worker.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidrun"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["evidrun"]
known-third-party = ["alembic", "sqlalchemy"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "scripts/change_contract", "scripts/check_change_contract.py"]
exclude = [".venv"]
reportUnusedFunction = false
