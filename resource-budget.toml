schema_version = "1"

[baseline_environment]
runner_os = "Linux 7.0.0-28-generic x86_64"
python = "3.14.4"
node = "24.14.1"
package_manager = "pnpm 9.15.0"
captured_on = "2026-07-31"
source = "local calibration on the versioned checkout"

[methodology]
statistic = "median"
dispersion = "median absolute deviation divided by the median"
noise_mad_ratio = 0.20
timing_policy = "warning-only; an inconclusive noisy sample never blocks"
memory_policy = "warning-only; process peak RSS is reported when the OS exposes it"
stable_policy = "only generated size/count and exact verification facts block"

[classifications]
generated = [
  "apps/web/dist/**",
  "apps/desktop/dist/main/**",
  "apps/desktop/dist/preload/**",
]
runtime_artifact = ["temporary SQLite databases", "Evidence Bundle audit archives"]
cache_excluded = [
  ".venv/**",
  "node_modules/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "**/__pycache__/**",
]

[scenarios.startup_import]
profile = "python"
workload = "startup_import"
repetitions = 5

[scenarios.startup_import.metrics.duration_ms]
unit = "milliseconds"
classification = "timing"
enforcement = "warning"
baseline = 1908.285
warning_ratio = 1.50

[scenarios.startup_import.metrics.peak_rss_kib]
unit = "KiB"
classification = "memory"
enforcement = "warning"
baseline = 106840.0
warning_ratio = 1.50

